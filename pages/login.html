<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../image/logo.png" type="image/png">
  <link rel="icon" href="../image/logo.png" type="image/png">
  <title>Login - Sanggara Management System</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="login-page">
    <!-- Left Hero Banner -->
    <div class="login-brand-panel">
      <div class="brand-content">
        <h1 class="brand-hero-title">Sanggar Bunda Febri Management System</h1>
        <p class="brand-hero-subtitle">Galeri SBF | Jln.Veteran gang keramik perum cihideung indah blok A1</p>
      </div>
    </div>

    <!-- Right Login Form -->
    <div class="login-form-panel">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">sanggara</div>
          <div class="login-subtitle">Masuk ke Dashboard</div>
        </div>

        <form class="login-form" action="dashboard.html" method="get">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" value="muhamadsolehs871@gmail.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Kata Sandi</label>
            <div class="input-with-icon">
              <input type="password" id="password" class="form-input" value="Sandi123!" required>
              <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <a href="#" class="forgot-password-link">Lupa kata sandi?</a>

          <button type="submit" class="btn btn-login">Masuk</button>
        </form>

        <div class="login-footer">
          <div class="footer-links">
            <a href="#">Privacy Policy</a> • <a href="#">Terms and Condition</a>
          </div>
          <div class="footer-copy">2026. Pratama Solusi Teknologi</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
