<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../image/logo.png" type="image/png">
  <link rel="icon" href="../image/logo.png" type="image/png">
  <title>Tambah Pelanggan - Sanggara Management System</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/tambah-pelanggan.css">
  <script src="../js/global.js"></script>
  <script src="../js/api.js"></script>
</head>
<body>
  <div class="modal-page-layout">
    <!-- Top Bar -->
    <header class="modal-header-bar">
      <div class="modal-header-left">
        <a href="kelola-pelanggan.html" class="btn-close-modal" aria-label="Tutup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
        <h1 class="modal-header-title">Tambah Pelanggan</h1>
      </div>

      <div class="modal-header-logo">sanggara.</div>
    </header>

    <!-- Modal Form Body -->
    <main class="modal-body-container">
      <div class="form-modal-card">
        <form class="form-stack" id="formTambahPelanggan" onsubmit="submitTambahPelanggan(event)">
          <!-- Nama Konsumen -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputNamaPelanggan">Nama Konsumen<span class="required-asterisk">*</span></label>
              <span class="field-counter" id="namaPelangganCounter">0/100</span>
            </div>
            <input type="text" id="inputNamaPelanggan" class="form-control-input" placeholder="Masukkan nama konsumen" required oninput="updateCounter(this, 'namaPelangganCounter', 100)">
          </div>

          <!-- Nomor Telepon -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputNoTelepon">Nomor Telepon<span class="required-asterisk">*</span></label>
              <span class="field-counter" id="telpPelangganCounter">0/30</span>
            </div>
            <input type="tel" id="inputNoTelepon" class="form-control-input" placeholder="08xxxxxxxxxx" required oninput="updateCounter(this, 'telpPelangganCounter', 30)">
          </div>

          <!-- Alamat (Kecamatan & Kelurahan) -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputKecamatan">Wilayah (Purwakarta)<span class="required-asterisk">*</span></label>
            </div>
            <div class="alamat-dual-select">
              <select class="form-control-select" id="inputKecamatan" required>
                <option value="">Pilih Kecamatan</option>
                <option value="Babakancikao">Kec. Babakancikao</option>
                <option value="Bojong">Kec. Bojong</option>
                <option value="Bungursari">Kec. Bungursari</option>
                <option value="Campaka">Kec. Campaka</option>
                <option value="Cibatu">Kec. Cibatu</option>
                <option value="Darangdan">Kec. Darangdan</option>
                <option value="Jatiluhur">Kec. Jatiluhur</option>
                <option value="Kiarapedes">Kec. Kiarapedes</option>
                <option value="Maniis">Kec. Maniis</option>
                <option value="Pasawahan">Kec. Pasawahan</option>
                <option value="Plered">Kec. Plered</option>
                <option value="Pondoksalam">Kec. Pondoksalam</option>
                <option value="Purwakarta">Kec. Purwakarta</option>
                <option value="Sukasari">Kec. Sukasari</option>
                <option value="Sukatani">Kec. Sukatani</option>
                <option value="Tegalwaru">Kec. Tegalwaru</option>
                <option value="Wanayasa">Kec. Wanayasa</option>
              </select>
              <input type="text" id="inputKelurahan" class="form-control-input" placeholder="Kelurahan / Desa (Contoh: Nagri Kaler)">
            </div>
          </div>

          <!-- Alamat Lengkap / Jalan -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputAlamatLengkap">Alamat Lengkap / Jalan</label>
              <span class="field-counter" id="alamatPelangganCounter">0/200</span>
            </div>
            <textarea id="inputAlamatLengkap" class="form-control-input" style="height: auto; min-height: 70px; padding: 10px; resize: vertical;" placeholder="Nama jalan, nomor rumah, RT/RW..." oninput="updateCounter(this, 'alamatPelangganCounter', 200)"></textarea>
          </div>

          <!-- Actions -->
          <div class="form-footer-actions">
            <a href="kelola-pelanggan.html" class="btn btn-text">Batal</a>
            <button type="submit" id="btnSubmitPelanggan" class="btn btn-primary" style="padding: 9px 26px;">Simpan ke Database</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    function updateCounter(input, counterId, max) {
      const counter = document.getElementById(counterId);
      if (counter) counter.textContent = `${input.value.length}/${max}`;
    }

    async function submitTambahPelanggan(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitPelanggan');

      const nama = document.getElementById('inputNamaPelanggan').value.trim();
      const telp = document.getElementById('inputNoTelepon').value.trim();
      const kecamatan = document.getElementById('inputKecamatan').value;
      const kelurahan = document.getElementById('inputKelurahan').value.trim();
      const alamatLengkap = document.getElementById('inputAlamatLengkap').value.trim();

      if (!nama) {
        alert('Silakan masukkan nama konsumen');
        return;
      }
      if (!telp) {
        alert('Silakan masukkan nomor telepon konsumen');
        return;
      }
      if (!kecamatan) {
        alert('Silakan pilih kecamatan');
        return;
      }

      const payload = {
        nama_pelanggan: nama,
        no_telepon: telp,
        nama_kecamatan: kecamatan,
        kelurahan_desa: kelurahan || null,
        alamat_lengkap: alamatLengkap || (kelurahan ? `${kelurahan}, Kec. ${kecamatan}` : `Kec. ${kecamatan}, Purwakarta`)
      };

      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Menyimpan...';
        }

        const res = await SanggaraAPI.tambahPelanggan(payload);
        alert(res.message || 'Data pelanggan berhasil disimpan ke database!');
        window.location.href = 'kelola-pelanggan.html';
      } catch (err) {
        console.error('Gagal menambahkan pelanggan:', err);
        alert('Gagal menambahkan pelanggan ke database: ' + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Simpan ke Database';
        }
      }
    }
  </script>
</body>
</html>
