<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../image/logo.png" type="image/png">
  <link rel="icon" href="../image/logo.png" type="image/png">
  <title>Tambah Pelanggan - Sanggara Management System</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/tambah-pelanggan.css">
  <script src="../js/global.js"></script>
  <script src="../js/api.js"></script>
</head>
<body>
  <div class="modal-page-layout">
    <!-- Top Bar -->
    <header class="modal-header-bar">
      <div class="modal-header-left">
        <a href="kelola-pelanggan.html" class="btn-close-modal" aria-label="Tutup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
        <h1 class="modal-header-title">Tambah Pelanggan</h1>
      </div>

      <div class="modal-header-logo">sanggara.</div>
    </header>

    <!-- Modal Form Body -->
    <main class="modal-body-container">
      <div class="form-modal-card">
        <form class="form-stack" id="formTambahPelanggan" onsubmit="submitTambahPelanggan(event)">
          <!-- Nama Konsumen -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputNamaPelanggan">Nama Konsumen<span class="required-asterisk">*</span></label>
              <span class="field-counter" id="namaPelangganCounter">0/100</span>
            </div>
            <input type="text" id="inputNamaPelanggan" class="form-control-input" placeholder="Masukkan nama konsumen" required oninput="updateCounter(this, 'namaPelangganCounter', 100)">
          </div>

          <!-- Nomor Telepon -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputNoTelepon">Nomor Telepon<span class="required-asterisk">*</span></label>
              <span class="field-counter" id="telpPelangganCounter">0/30</span>
            </div>
            <input type="tel" id="inputNoTelepon" class="form-control-input" placeholder="08xxxxxxxxxx" required oninput="updateCounter(this, 'telpPelangganCounter', 30)">
          </div>

          <!-- Alamat (Kecamatan & Kelurahan via API Ogan) -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputKecamatan">Wilayah (Purwakarta)<span class="required-asterisk">*</span></label>
            </div>
            <div class="alamat-dual-select">
              <select class="form-control-select" id="inputKecamatan" onchange="onKecamatanChange()" required>
                <option value="" disabled selected>Memuat Kecamatan dari API Ogan...</option>
              </select>
              <select class="form-control-select" id="inputKelurahan" required>
                <option value="" disabled selected>Pilih Kelurahan / Desa...</option>
              </select>
            </div>
          </div>

          <!-- Alamat Lengkap / Jalan -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputAlamatLengkap">Alamat Lengkap / Jalan</label>
              <span class="field-counter" id="alamatPelangganCounter">0/200</span>
            </div>
            <textarea id="inputAlamatLengkap" class="form-control-input" style="height: auto; min-height: 70px; padding: 10px; resize: vertical;" placeholder="Nama jalan, nomor rumah, RT/RW..." oninput="updateCounter(this, 'alamatPelangganCounter', 200)"></textarea>
          </div>

          <!-- Actions -->
          <div class="form-footer-actions">
            <a href="kelola-pelanggan.html" class="btn btn-text">Batal</a>
            <button type="submit" id="btnSubmitPelanggan" class="btn btn-primary" style="padding: 9px 26px;">Simpan ke Database</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    let oganDistrictsList = [];

    function updateCounter(input, counterId, max) {
      const counter = document.getElementById(counterId);
      if (counter) counter.textContent = `${input.value.length}/${max}`;
    }

    async function loadOganDistricts() {
      const kecSelect = document.getElementById('inputKecamatan');
      if (!kecSelect) return;

      kecSelect.disabled = true;
      kecSelect.innerHTML = '<option value="" disabled selected>Memuat Kecamatan dari API Ogan...</option>';

      try {
        const res = await SanggaraAPI.getDistricts('3214');
        if (res.status === 'success' && res.data && res.data.length > 0) {
          oganDistrictsList = res.data;
          kecSelect.innerHTML = '<option value="" disabled>Pilih Kecamatan</option>' + res.data.map(d => `
            <option value="${d.id}" data-name="${d.name}" ${d.name.toLowerCase() === 'purwakarta' ? 'selected' : ''}>
              ${d.label || ('Kecamatan ' + d.name)}
            </option>
          `).join('');

          kecSelect.disabled = false;
          const selectedOption = kecSelect.options[kecSelect.selectedIndex];
          const districtId = selectedOption ? selectedOption.value : (res.data[0] ? res.data[0].id : 3214100);
          await loadOganVillages(districtId);
        } else {
          fallbackDistricts();
        }
      } catch (err) {
        console.warn('Gagal memuat kecamatan dari API Ogan, fallback aktif:', err);
        fallbackDistricts();
      }
    }

    function fallbackDistricts() {
      const kecSelect = document.getElementById('inputKecamatan');
      if (!kecSelect) return;
      kecSelect.disabled = false;
      const list = [
        { id: 3214101, name: 'Babakancikao', label: 'Kecamatan Babakancikao' },
        { id: 3214070, name: 'Bojong', label: 'Kecamatan Bojong' },
        { id: 3214112, name: 'Bungursari', label: 'Kecamatan Bungursari' },
        { id: 3214110, name: 'Campaka', label: 'Kecamatan Campaka' },
        { id: 3214111, name: 'Cibatu', label: 'Kecamatan Cibatu' },
        { id: 3214060, name: 'Darangdan', label: 'Kecamatan Darangdan' },
        { id: 3214010, name: 'Jatiluhur', label: 'Kecamatan Jatiluhur' },
        { id: 3214081, name: 'Kiarapedes', label: 'Kecamatan Kiarapedes' },
        { id: 3214020, name: 'Maniis', label: 'Kecamatan Maniis' },
        { id: 3214090, name: 'Pasawahan', label: 'Kecamatan Pasawahan' },
        { id: 3214040, name: 'Plered', label: 'Kecamatan Plered' },
        { id: 3214091, name: 'Pondok Salam', label: 'Kecamatan Pondok Salam' },
        { id: 3214100, name: 'Purwakarta', label: 'Kecamatan Purwakarta' },
        { id: 3214011, name: 'Sukasari', label: 'Kecamatan Sukasari' },
        { id: 3214050, name: 'Sukatani', label: 'Kecamatan Sukatani' },
        { id: 3214030, name: 'Tegal Waru', label: 'Kecamatan Tegal Waru' },
        { id: 3214080, name: 'Wanayasa', label: 'Kecamatan Wanayasa' }
      ];
      oganDistrictsList = list;
      kecSelect.innerHTML = '<option value="" disabled>Pilih Kecamatan</option>' + list.map(d => `
        <option value="${d.id}" data-name="${d.name}" ${d.name.toLowerCase() === 'purwakarta' ? 'selected' : ''}>
          ${d.label}
        </option>
      `).join('');
      loadOganVillages(3214100);
    }

    async function onKecamatanChange() {
      const kecSelect = document.getElementById('inputKecamatan');
      const districtId = kecSelect ? kecSelect.value : 3214100;
      await loadOganVillages(districtId);
    }

    async function loadOganVillages(districtId, preSelectedName = null) {
      const kelSelect = document.getElementById('inputKelurahan');
      if (!kelSelect) return;

      kelSelect.disabled = true;
      kelSelect.innerHTML = '<option value="" disabled selected>Memuat kelurahan/desa dari API Ogan...</option>';

      try {
        const res = await SanggaraAPI.getVillages(districtId);
        if (res.status === 'success' && res.data && res.data.length > 0) {
          kelSelect.innerHTML = '<option value="" disabled ' + (!preSelectedName ? 'selected' : '') + '>Pilih Kelurahan / Desa</option>' + res.data.map(v => {
            const isSelected = preSelectedName ? (v.name.toLowerCase() === preSelectedName.toLowerCase()) : false;
            return `<option value="${v.name}" ${isSelected ? 'selected' : ''}>${v.label || v.name}</option>`;
          }).join('');

          if (!preSelectedName && res.data[0]) {
            kelSelect.selectedIndex = 1; // default to first village
          }
        } else {
          kelSelect.innerHTML = '<option value="Pusat Wilayah">Pusat Wilayah</option>';
        }
      } catch (err) {
        console.warn('Gagal memuat kelurahan dari API Ogan, fallback aktif:', err);
        kelSelect.innerHTML = `
          <option value="Nagri Kaler" selected>Kelurahan Nagri Kaler</option>
          <option value="Nagri Kidul">Kelurahan Nagri Kidul</option>
          <option value="Cipaisan">Kelurahan Cipaisan</option>
          <option value="Ciseureuh">Kelurahan Ciseureuh</option>
        `;
      } finally {
        kelSelect.disabled = false;
      }
    }

    async function submitTambahPelanggan(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitPelanggan');

      const nama = document.getElementById('inputNamaPelanggan').value.trim();
      const telp = document.getElementById('inputNoTelepon').value.trim();
      const kecSelect = document.getElementById('inputKecamatan');
      const selectedKecOpt = kecSelect ? kecSelect.options[kecSelect.selectedIndex] : null;
      const kecName = selectedKecOpt ? (selectedKecOpt.getAttribute('data-name') || selectedKecOpt.text.replace(/^Kecamatan\s*/i, '').replace(/^Kec\.\s*/i, '')) : 'Purwakarta';
      const kelSelect = document.getElementById('inputKelurahan');
      const kelName = kelSelect ? kelSelect.value : '';
      const alamatLengkap = document.getElementById('inputAlamatLengkap').value.trim();

      if (!nama) {
        SanggaraModal.alert('Silakan masukkan nama konsumen', { type: 'warning', title: 'Data Belum Lengkap' });
        return;
      }
      if (!telp) {
        SanggaraModal.alert('Silakan masukkan nomor telepon konsumen', { type: 'warning', title: 'Data Belum Lengkap' });
        return;
      }
      if (!kecSelect || !kecSelect.value) {
        SanggaraModal.alert('Silakan pilih kecamatan wilayah Purwakarta', { type: 'warning', title: 'Pilih Wilayah' });
        return;
      }

      const payload = {
        nama_pelanggan: nama,
        no_telepon: telp,
        nama_kecamatan: 'Kec. ' + kecName,
        kelurahan_desa: kelName || null,
        alamat_lengkap: alamatLengkap || (kelName ? `${kelName}, Kec. ${kecName}` : `Kec. ${kecName}, Purwakarta`)
      };

      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Menyimpan...';
        }

        const res = await SanggaraAPI.tambahPelanggan(payload);
        await SanggaraModal.alert(res.message || 'Data pelanggan berhasil disimpan ke database!', {
          type: 'success',
          title: 'Berhasil Ditambahkan',
          buttonText: 'Lihat Data Pelanggan'
        });
        window.location.href = 'kelola-pelanggan.html';
      } catch (err) {
        console.error('Gagal menambahkan pelanggan:', err);
        SanggaraModal.alert('Gagal menambahkan pelanggan ke database: ' + err.message, {
          type: 'danger',
          title: 'Gagal Menyimpan'
        });
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Simpan ke Database';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOganDistricts();
    });
  </script>
</body>
</html>
