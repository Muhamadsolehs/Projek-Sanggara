<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../image/logo.png" type="image/png">
  <link rel="icon" href="../image/logo.png" type="image/png">
  <title>Tambah Kategori - Sanggara Management System</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/tambah-kategori.css">
  <script src="../js/global.js"></script>
  <script src="../js/api.js"></script>
</head>
<body>
  <div class="modal-page-layout">
    <!-- Top Bar -->
    <header class="modal-header-bar">
      <div class="modal-header-left">
        <a href="kelola-kategori.html" class="btn-close-modal" aria-label="Tutup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
        <h1 class="modal-header-title">Tambah Kategori</h1>
      </div>

      <div class="modal-header-logo">sanggara.</div>
    </header>

    <!-- Modal Form Body -->
    <main class="modal-body-container">
      <div class="form-modal-card">
        <form class="form-stack" id="formTambahKategori" onsubmit="submitTambahKategori(event)">
          <!-- Nama Kategori -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputNamaKategori">Nama Kategori<span class="required-asterisk">*</span></label>
              <span class="field-counter" id="namaKategoriCounter">0/100</span>
            </div>
            <input type="text" id="inputNamaKategori" class="form-control-input" placeholder="Masukkan nama kategori (contoh: Kostum Tari Modern)" required oninput="updateCounter(this, 'namaKategoriCounter', 100)">
          </div>

          <!-- Deskripsi Kategori -->
          <div class="form-group">
            <div class="form-field-header">
              <label class="form-field-label" for="inputDeskripsiKategori">Deskripsi Kategori</label>
              <span class="field-counter" id="deskripsiKategoriCounter">0/200</span>
            </div>
            <textarea id="inputDeskripsiKategori" class="form-control-input" style="height: auto; min-height: 80px; padding: 10px; resize: vertical;" placeholder="Deskripsi jenis koleksi busana/kostum dalam kategori ini..." oninput="updateCounter(this, 'deskripsiKategoriCounter', 200)"></textarea>
          </div>

          <!-- Actions -->
          <div class="form-footer-actions">
            <a href="kelola-kategori.html" class="btn btn-text">Batal</a>
            <button type="submit" id="btnSubmitKategori" class="btn btn-primary" style="padding: 9px 26px;">Simpan ke Database</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    function updateCounter(input, counterId, max) {
      const counter = document.getElementById(counterId);
      if (counter) counter.textContent = `${input.value.length}/${max}`;
    }

    async function submitTambahKategori(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitKategori');

      const nama = document.getElementById('inputNamaKategori').value.trim();
      const deskripsi = document.getElementById('inputDeskripsiKategori').value.trim();

      if (!nama) {
        alert('Silakan masukkan nama kategori');
        return;
      }

      const payload = {
        nama_kategori: nama,
        deskripsi: deskripsi || null
      };

      try {
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Menyimpan...';
        }

        const res = await SanggaraAPI.tambahKategori(payload);
        alert(res.message || 'Kategori baru berhasil disimpan ke database!');
        window.location.href = 'kelola-kategori.html';
      } catch (err) {
        console.error('Gagal menambahkan kategori:', err);
        alert('Gagal menambahkan kategori ke database: ' + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Simpan ke Database';
        }
      }
    }
  </script>
</body>
</html>
